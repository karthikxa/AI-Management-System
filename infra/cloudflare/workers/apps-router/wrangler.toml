main = "worker.mjs"
compatibility_date = "2026-08-01"
workers_dev = false
account_id = "9785405a992435bb0c7bd19f9b6d26d5"

name = "zed-apps-router"
routes = [
  { pattern = "*.apps.zed.com/*", zone_name = "zed.com" },
]

[vars]
DEV_API_ORIGIN = "https://dev-api.zed.com"
STAGING_API_ORIGIN = "https://staging-api.zed.com"
PROD_API_ORIGIN = "https://api.zed.com"
PREVIEW_API_ORIGIN = "https://dev-api.zed.com"

# DEV_EDGE_SECRET, STAGING_EDGE_SECRET, PROD_EDGE_SECRET, and
# PREVIEW_EDGE_SECRET are Worker secrets. Each value must equal
# ZED_APPS_EDGE_SECRET in its API environment.
